name: Supabase keep-alive

on:
  schedule:
    - cron: '23 2 * * 1,4'   # Mon & Thu 02:23 UTC (10:23 Taipei); max gap 4 days < 7
  workflow_dispatch:          # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call live_ping()
        run: |
          # Reads the same public URL + publishable key the page uses, so nothing to keep in sync.
          URL=$(grep -oP "SUPABASE_URL='\K[^']+" index.html)
          KEY=$(grep -oP "SUPABASE_KEY='\K[^']+" index.html)
          curl -sS --fail-with-body --retry 3 --retry-delay 20 \
            -X POST "$URL/rest/v1/rpc/live_ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
