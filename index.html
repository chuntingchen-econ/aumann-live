<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aumann Live v2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20222a;background:#f4f5f7}body{max-width:560px;margin:auto;padding:14px}h1{font-size:25px}h2{font-size:19px}.card{background:#fff;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 1px 5px #ddd}input{box-sizing:border-box;width:100%;padding:12px;font-size:17px;border:1px solid #c5c8d0;border-radius:8px}label{display:block;margin:10px 0 5px;font-weight:600}button{padding:13px;border:1px solid #bbb;border-radius:10px;font-size:16px;background:#fff;cursor:pointer}button.main{background:#223149;color:#fff;border-color:#223149}button:disabled{opacity:.35}button:active{transform:scale(.98)}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:9px}.choices button{font-size:22px;font-weight:650;touch-action:manipulation}.big{font-size:30px;font-weight:700}.timer{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}.muted{color:#626b78}.hide{display:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair>div{background:#f1f2f5;border-radius:10px;padding:14px;text-align:center}.history{max-height:185px;overflow-y:auto;line-height:1.8}.ok{color:#177147}.warn{color:#a23426}.controls{display:flex;gap:10px;flex-wrap:wrap}#message{white-space:pre-wrap}small{line-height:1.5}
</style></head><body>
<h1>🎲 Aumann Live</h1>
<div id="setup" class="card"><h2>建立雙人遊戲</h2><label for="states">狀態集合 S</label><input id="states" value="ABCD" maxlength="6"><label for="rounds">總回合數</label><input id="rounds" type="number" value="3" min="1" max="100"><label for="seconds">每回合秒數</label><input id="seconds" type="number" value="15" min="1" max="300"><p class="muted">題目 Q1、Q2、Q3 依序循環。每回合重新抽取真實狀態和兩人的資訊。</p><button id="create" class="main">Create Game</button></div>
<div id="game" class="hide"><section class="card"><b id="seat"></b><p id="roundlabel" class="muted"></p><h2>本回合資訊</h2><div id="notice" class="big">—</div><p id="connection" class="muted"></p></section>
<section class="card"><h2 id="qtitle">題目</h2><p id="rules"></p><p class="muted">每秒結束時以當時有效選擇計分；未選擇時為 0 分。</p><div id="readystatus" class="muted"></div><button id="ready" class="main">我已閱讀，Ready</button></section>
<section id="playpanel" class="card"><h2>選擇狀態</h2><div id="timer" class="timer">—</div><div id="choices" class="choices"></div><div class="pair" style="margin-top:16px"><div><span class="muted">你的最新選擇</span><div id="mine" class="big">—</div></div><div><span class="muted">對手最新選擇</span><div id="theirs" class="big">—</div></div></div></section>
<section class="card"><h2>即時點選紀錄</h2><div id="history" class="history"></div></section>
<section class="card"><h2>本回合得分</h2><div id="scores" class="muted">回合結束後顯示。</div></section>
<section id="host" class="card hide"><h2>Player 1 控制</h2><div id="invite" class="hide"><label>Player 2 專屬網址</label><input id="guesturl" readonly><button id="copy">複製 Player 2 連結</button></div><div class="controls" style="margin-top:12px"><button class="main" id="prepare">準備下一回合</button><button class="main" id="start">雙方 Ready，開始計時</button><button id="stop">停止實驗</button></div></section></div>
<p id="message" class="warn"></p>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// ONLY publishable key; NEVER put sb_secret_ or service_role in this file.
const SUPABASE_URL='https://nysbumbjvhzjaokuiqst.supabase.co';
const SUPABASE_KEY='sb_publishable_8d8Lta1jIrXyrJmh8uPoCQ_ilABjqU9';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
const el=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);let room=qs.get('room'),token=qs.get('token');
let game=null,channel=null,clockOffset=0,loading=false,pending=false,submitting=false,scoreLoading=false;
function msg(s){el('message').textContent=s||''}
async function rpc(fn,args){const {data,error}=await db.rpc(fn,args);if(error)throw Error(error.message);return data}
const credentials=()=>({p_room:room,p_token:token});
const questions={
1:['Q1：真實狀態協調','每一秒結束時，若雙方選擇相同且都等於真實狀態，雙方各得 1 分；否則各得 0 分。'],
2:['Q2：避開真實狀態','每一秒結束時，若雙方選擇不同，且兩個選擇都不等於真實狀態，雙方各得 1 分；否則各得 0 分。'],
3:['Q3：持續選對的速度競爭','每一秒結束時，若你目前選擇真實狀態、已連續選對至少 2 秒，且你目前這段連續選對比對手早開始至少 2 秒（或對手目前沒有選對），你得 1 分；否則得 0 分。對手獨立計分。']
};
async function createGame(){try{
 el('create').disabled=true;
 let states=[...el('states').value.trim().toUpperCase()],rounds=Number(el('rounds').value),seconds=Number(el('seconds').value);
 if(states.length<2||states.length>6||new Set(states).size!==states.length||states.some(s=>!/^[A-Z]$/.test(s))||!Number.isInteger(rounds)||rounds<1||rounds>100||!Number.isInteger(seconds)||seconds<1||seconds>300)throw Error('請輸入 2–6 個不同字母、1–100 回合、1–300 秒');
 let d=await rpc('live_create_v2',{p_states:states,p_rounds:rounds,p_seconds:seconds});room=d.room;token=d.host_token;
 let base=location.origin+location.pathname;
 sessionStorage.setItem('guest_'+room,`${base}?room=${room}&token=${d.guest_token}`);
 history.replaceState({},'',`${base}?room=${room}&token=${token}`);await enter();
 }catch(e){msg(e.message);el('create').disabled=false}}
function remaining(){return (!game||!game.started_ms||game.status!=='playing')?0:Math.max(0,game.seconds*1000-(Date.now()+clockOffset-game.started_ms))}
function updateTimer(){if(!game)return;
 const active=remaining()>0&&game.status==='playing';
 el('timer').textContent=game.status==='stopped'?'已停止':game.status==='ready'?'等待開始':game.status==='waiting'?'尚未開始':(remaining()/1000).toFixed(1)+' 秒';
 document.querySelectorAll('.statebtn').forEach(b=>b.disabled=!active);
 el('ready').disabled=game.status!=='ready'||game.ready_me;
 el('ready').classList.toggle('hide',game.status!=='ready');
 const host=game.player===1;
 el('prepare').disabled=!host||game.status==='stopped'||game.round>=game.max_rounds||(game.status==='playing'&&active)||game.status==='ready';
 el('start').disabled=!host||game.status!=='ready'||!game.ready_me||!game.ready_opponent;
 el('start').classList.toggle('hide',game.status!=='ready');
 el('prepare').classList.toggle('hide',game.status==='ready');
 if(game.round>0&&game.status==='playing'&&!active)showScore();
}
let scoreKey='';
async function showScore(){if(scoreLoading||!game)return;const key=room+':'+game.round;if(scoreKey===key)return;
 scoreLoading=true;try{let d=await rpc('live_score',{...credentials(),p_round:game.round});
 el('scores').textContent=`Player 1：${d.scores[0]} 分；Player 2：${d.scores[1]} 分`;
 scoreKey=key;
 }catch(e){/* server may be completing cutoff */}finally{scoreLoading=false}}
function render(){
 if(!game)return;
 el('seat').textContent='Player '+game.player;
 el('roundlabel').textContent=`Round ${game.round} / ${game.max_rounds} · 每回合 ${game.seconds} 秒`;
 if(game.round===0){el('notice').textContent='尚未產生第一回合';el('qtitle').textContent='等待開始';el('rules').textContent='';}
 else{el('qtitle').textContent=questions[game.question][0];el('rules').textContent=questions[game.question][1];
 const labels=(game.notice_states||[]).join('、');
 el('notice').textContent=(game.framing==='negative'?'真實狀態一定不在 ':'真實狀態在 ')+labels+' 之中。';
 }
 el('readystatus').textContent=game.status==='ready'?`你：${game.ready_me?'Ready':'未 Ready'}；對手：${game.ready_opponent?'Ready':'未 Ready'}`:(game.status==='stopped'?'實驗已停止':'');
 el('choices').replaceChildren();(game.states||[]).forEach(s=>{const b=document.createElement('button');b.textContent=s;b.className='statebtn';b.addEventListener('click',()=>choose(s));el('choices').append(b)});
 let mine='—',theirs='—';const hist=el('history');hist.replaceChildren();
 (game.clicks||[]).forEach(c=>{if(c.player===game.player)mine=c.choice;else theirs=c.choice;
 const p=document.createElement('div');p.textContent=`${(c.elapsed_ms/1000).toFixed(3)}s · Player ${c.player}：${c.choice}`;hist.appendChild(p)});
 el('mine').textContent=mine;el('theirs').textContent=theirs;
 if(scoreKey!==room+':'+game.round)el('scores').textContent='回合結束後顯示。';
 updateTimer();
}
async function refresh(){if(loading){pending=true;return;}loading=true;
 try{let before=Date.now(),data=await rpc('live_view_v2',credentials()),after=Date.now();clockOffset=data.server_ms-(before+after)/2;
 let oldRound=game?.round;game=data;if(oldRound!==data.round){scoreKey='';el('scores').textContent='回合結束後顯示。'}render();msg('');}
 catch(e){msg(e.message)}finally{loading=false;if(pending){pending=false;void refresh()}}}
async function choose(state){if(submitting||remaining()<=0)return;submitting=true;
 try{await rpc('live_choose',{...credentials(),p_choice:state});await refresh()}catch(e){msg(e.message)}finally{submitting=false}}
async function action(fn){try{await rpc(fn,credentials());await refresh()}catch(e){msg(e.message)}}
async function enter(){el('setup').classList.add('hide');el('game').classList.remove('hide');await refresh();if(!game)return;
 if(game.player===1){el('host').classList.remove('hide');let link=sessionStorage.getItem('guest_'+room);if(link){el('invite').classList.remove('hide');el('guesturl').value=link}}
 channel=db.channel('aumann:'+room,{config:{private:false}});
 channel.on('broadcast',{event:'changed'},()=>void refresh()).subscribe(status=>{el('connection').textContent='Realtime: '+status;if(status==='SUBSCRIBED')void refresh()});
}
el('create').onclick=createGame;
el('ready').onclick=()=>action('live_ready_v2');
el('prepare').onclick=()=>action('live_prepare_v2');
el('start').onclick=()=>action('live_start_v2');
el('stop').onclick=()=>action('live_stop');
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('guesturl').value);msg('已複製 Player 2 連結')}catch{msg('請長按網址手動複製')}};
setInterval(updateTimer,50);
setInterval(()=>{if(room&&token&&!document.hidden)void refresh()},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&room&&token)void refresh()});
if(room&&token)void enter();
</script></body></html>
